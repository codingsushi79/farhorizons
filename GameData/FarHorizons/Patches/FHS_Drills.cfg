// Every surface drill (stock or modded) can pull a shallow regolith core.
@PART[*]:HAS[@MODULE[ModuleResourceHarvester]:HAS[#HarvesterType[0]],!MODULE[ModuleCoreSampler]]:FOR[FarHorizons]
{
	MODULE
	{
		name = ModuleCoreSampler
		experimentID = fhsRegolithCore
		drillDuration = 90
		ecPerSecond = 1
		requireDeployedDrill = True
		xmitDataScalar = 0.15
		maxStoredData = 3
	}
}

// The big Drill-O-Matic can also bore down for a deep stratigraphic core.
@PART[RadialDrill]:AFTER[FarHorizons]
{
	MODULE
	{
		name = ModuleCoreSampler
		experimentID = fhsDeepCore
		drillDuration = 300
		ecPerSecond = 3
		requireDeployedDrill = True
		xmitDataScalar = 0.1
		maxStoredData = 2
	}
}
