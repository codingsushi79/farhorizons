// Any part with a command module (probe cores, pods) can act as a kinetic impactor:
// crash it hard into a world and landed seismometers there record the impact.
@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[ModuleImpactor]]:FOR[FarHorizons]
{
	MODULE
	{
		name = ModuleImpactor
		minImpactEnergyMJ = 5
		fullImpactEnergyMJ = 60
		maxImpactHeight = 150
	}
}
