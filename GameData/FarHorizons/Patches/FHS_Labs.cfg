// The Mobile Processing Lab gets a crewed sample analyzer: twice as fast, and scientists speed it up further.
@PART[Large_Crewed_Lab|Large.Crewed.Lab]:FOR[FarHorizons]
{
	MODULE
	{
		name = ModuleSampleAnalyzer
		analyses = fhsRegolithCore>fhsCoreAnalysis@2; fhsDeepCore>fhsDeepCoreAnalysis@6; fhsSolarWind>fhsSolarWindAnalysis@4; fhsCosmicDust>fhsDustAnalysis@3; fhsCometDust>fhsCometAnalysis@6
		ecPerSecond = 3
		minCrew = 1
		speedMultiplier = 2
		scientistBonus = 0.35
		analyzedTransmitScalar = 1.0
		maxStoredData = 6
		backgroundProcessing = True
	}
}
