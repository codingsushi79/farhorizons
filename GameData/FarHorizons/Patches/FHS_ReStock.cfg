// ReStock compatibility.
// ReStock blacklists the stock science models our parts reuse (Restock.restockblacklist), so with ReStock
// installed those models are never loaded and every Far Horizons part fails to compile ("Cannot clone model").
// Point each part at ReStock's replacement model instead. ReStock keeps the Goo canister's "Deploy" animation.

@PART[fhs*]:NEEDS[ReStock]:FOR[FarHorizons]
{
	@MODEL:HAS[#model[Squad/Parts/Science/sensorThermometer/model]]
	{
		@model = ReStock/Assets/Science/restock-thermometer
	}
	@MODEL:HAS[#model[Squad/Parts/Science/sensorBarometer/model]]
	{
		@model = ReStock/Assets/Science/restock-barometer
	}
	@MODEL:HAS[#model[Squad/Parts/Science/sensorAccelerometer/model]]
	{
		@model = ReStock/Assets/Science/restock-accelerometer
	}
	@MODEL:HAS[#model[Squad/Parts/Science/sensorGravimeter/model]]
	{
		@model = ReStock/Assets/Science/restock-gravimeter
	}
	@MODEL:HAS[#model[Squad/Parts/Science/GooExperiment/GooExperiment]]
	{
		@model = ReStock/Assets/Science/restock-goocanister-radial-1
	}
}
