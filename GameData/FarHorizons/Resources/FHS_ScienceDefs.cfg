		DunaSrfLanded = The waves arrive sharply, then slow down sharply at depth. Duna has a distinct, partly molten core.
		MinmusSrfLanded = The shock waves race through Minmus surprisingly fast. Its interior is dense and uniform. Not mint.
		EveSrfLanded = The impact registers clearly over the background rumble of Eve's volcanoes.
		IkeSrfLanded = Ike's crust carries the waves with almost no loss. It is cold and solid all the way through.
		TyloSrfLanded = A clean, deep signal. Tylo's core is large and very dense.
