// Far Horizons Science - experiment definitions
// situationMask / biomeMask bits: SrfLanded=1 SrfSplashed=2 FlyingLow=4 FlyingHigh=8 InSpaceLow=16 InSpaceHigh=32

// ===================================================================================
//  PHYSICAL SAMPLES (low transmit value: bring them home or analyze them on board)
// ===================================================================================

EXPERIMENT_DEFINITION
{
	id = fhsRegolithCore
	title = Shallow Regolith Core
	baseValue = 12
	scienceCap = 18
	dataScale = 1
	requireAtmosphere = False
	situationMask = 1
	biomeMask = 1

	RESULTS
	{
		default = The drill brings up a tube of compacted grey regolith. It smells faintly of gunpowder, which is concerning given that nobody up here has a nose.
		default = Fine layering in the core suggests millions of years of slow micrometeorite gardening. Someone should really rake this place.
		default = The core is mostly loose grit with a few glassy beads. The beads are pretty. The grit is not.
		KerbinSrfLanded = A core of loam, roots and one very surprised worm. Not exactly deep space, but the geologists are pleased.
		MunSrfLanded = The Mun's regolith is sharp, angular and clingy. It has already ruined three pairs of gloves just by looking at it.
		MinmusSrfLanded = The core is pale green and crumbly. The flight surgeon has forbidden anyone to lick it. Twice.
		DunaSrfLanded = Rust-red dust with fine-grained iron oxides. Some layers look like they were laid down in standing water.
		IkeSrfLanded = Dark, dense basaltic fragments. Ike's surface has clearly been sitting around doing nothing for a very long time.
		GillySrfLanded = Getting the drill to bite was hard; the gravity barely holds the regolith in place. The core is a loose rubble of pebbles.
		EveSrfLanded = A dense, purple-stained core. Getting it back to orbit will be a separate, larger problem.
		MohoSrfLanded = The core is baked hard and shows signs of repeated thermal cycling. It is also still warm.
		DresSrfLanded = Fragmented, impact-shocked rock. Dres has been hit by a lot of things, which explains its mood.
		LaytheSrfLanded = Damp sand with traces of salts. This world has had liquid water for a long time.
		VallSrfLanded = The top layer is ice, crushed and refrozen many times by tidal flexing.
		TyloSrfLanded = Densely packed regolith under brutal gravity. The drill motor is filing a complaint.
		BopSrfLanded = Strange, almost organic-looking dark material. The science team insists it is "probably" just carbon.
		PolSrfLanded = Pollen-yellow grains with a sticky texture. The core has to be gently persuaded out of the tube.
		EelooSrfLanded = A pristine core of ices and rock, essentially unchanged since the formation of the system.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsDeepCore
	title = Deep Stratigraphic Core
	baseValue = 25
	scienceCap = 35
	dataScale = 1.5
	requireAtmosphere = False
	situationMask = 1
	biomeMask = 1

	RESULTS
	{
		default = Meters of layered history pulled up in one long, beautiful cylinder. Each band is a chapter; the bottom one is mostly footnotes.
		default = Below the dusty surface, the core turns to solid bedrock shot through with mineral veins.
		default = Distinct impact ejecta layers stack on top of each other like a timeline of every bad day this place has had.
		KerbinSrfLanded = Sedimentary layers, a fossil shell, and what appears to be a buried snack wrapper. Kerbin is complicated.
		MunSrfLanded = Deep down, the Mun's crust contains anorthosite: light, ancient rock that crystallized out of a global magma ocean.
		MinmusSrfLanded = The deep core is almost pure crystalline carbonate. Minmus appears to be one enormous geode with delusions of grandeur.
		DunaSrfLanded = Water ice appears a few meters down, sealed beneath the dust. Duna was a wetter world once, and still is if you dig.
		IkeSrfLanded = Ike's interior shows no layering at all, as if it cooled in one quick, unremarkable afternoon.
		EveSrfLanded = Volcanic layers alternate with strange purple mineral deposits. The pressure at the bottom of the hole is frankly rude.
		MohoSrfLanded = The deep core is dominated by metallic iron. Moho may be the exposed core of a much larger world that lost its mantle.
		DresSrfLanded = Brecciated rock all the way down. Dres has been smashed apart and glued back together repeatedly.
		LaytheSrfLanded = Hydrothermal minerals line the deeper layers. Warm water has been circulating through this crust for ages.
		VallSrfLanded = The ice gives way to slush. There may be a liquid ocean further down than this drill can reach.
		TyloSrfLanded = Compressed, metamorphosed rock. Tylo's gravity has been quietly crushing its own crust for billions of years.
		EelooSrfLanded = Primordial ices with trapped noble gases: a time capsule from the cold outer disk where the system was born.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsSolarWind
	title = Solar Wind Ion Capture
	baseValue = 30
	scienceCap = 40
	dataScale = 1
	requireAtmosphere = False
	situationMask = 48
	biomeMask = 0

	RESULTS
	{
		default = The ultra-pure collector wafers are sealed with a satisfying clunk. Implanted within them: a few micrograms of the sun itself.
		default = Ions of hydrogen, helium, neon and oxygen are embedded in the collector surface. It is the most expensive dust in history.
		SunInSpaceLow = Sealed deep in the sun's glare. The wafers are scorched at the edges but saturated with fresh solar material.
		SunInSpaceHigh = A clean sample of the undisturbed solar wind, far from any planet's meddling magnetic field.
		MohoInSpaceLow = So close to the sun the collector barely needed to be opened. The isotope load is extraordinary.
		MohoInSpaceHigh = The flux this close to Kerbol is intense; the canister is noticeably warmer than when it was opened.
		KerbinInSpaceHigh = A thin sample. Kerbin's magnetic field deflects much of the wind, but enough slipped past to count.
		JoolInSpaceHigh = Out here the solar wind is thin and slow, but it carries the signature of its long journey from the sun.
		EelooInSpaceHigh = A trickle of ancient-looking ions. At this distance the solar wind is almost spent.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsCosmicDust
	title = Interplanetary Dust Capture
	baseValue = 20
	scienceCap = 30
	dataScale = 1
	requireAtmosphere = False
	situationMask = 48
	biomeMask = 0

	RESULTS
	{
		default = Tiny carrot-shaped tracks riddle the aerogel. Each ends in a grain of dust older than any planet.
		default = The aerogel caught a few hundred micro-particles. Some are glassy, some are carbon-rich, all of them are very small.
		SunInSpaceHigh = Clean interplanetary dust, the leftover building material of the solar system.
		SunInSpaceLow = The dust grains here are partially melted, cooked by their long spiral toward the sun.
		KerbinInSpaceHigh = Mostly interplanetary dust, plus a fleck of paint that is almost certainly from an old Kerbal rocket.
		JoolInSpaceHigh = Fine sulfurous grains, probably flung out from Jool's moons.
		DresInSpaceHigh = Rocky fragments, likely debris from collisions in the Dres belt.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsCometDust
	title = Cometary Coma Particles
	baseValue = 60
	scienceCap = 80
	dataScale = 1.5
	requireAtmosphere = False
	situationMask = 48
	biomeMask = 0

	RESULTS
	{
		default = The aerogel is studded with fluffy, fragile grains from the comet's coma. Some contain complex organic molecules.
		default = Comet dust, captured at hypervelocity. The grains include high-temperature minerals that formed close to the young sun and somehow ended up out here in the cold.
		default = A rich haul of icy, carbon-rich particles. The comet is shedding the oldest material in the solar system and you just caught some.
	}
}

// ===================================================================================
//  LAB ANALYSES (produced by the Sample Analyzer, fully transmittable)
// ===================================================================================

EXPERIMENT_DEFINITION
{
	id = fhsCoreAnalysis
	title = Regolith Core Analysis
	baseValue = 10
	scienceCap = 15
	dataScale = 1
	requireAtmosphere = False
	situationMask = 1
	biomeMask = 1

	RESULTS
	{
		default = X-ray diffraction identifies a dozen minerals. Two of them were not in the textbook, which means someone gets to write a new textbook.
		default = Grain-size analysis shows the regolith was churned by impacts over a very long time. The lab estimates the surface age with satisfying precision.
		default = Spectroscopy of the core reveals trace volatiles bound up in the grains. They are released with a pleasing little puff.
		DunaSrfLanded = Perchlorate salts are present throughout the sample. They would make the soil toxic to plants, and possibly to optimism.
		MinmusSrfLanded = The analysis is unambiguous: it is a carbonate mineral. It is not, as previously hypothesized, mint.
		MunSrfLanded = Helium-3 is implanted in the grains by the solar wind. Several engineers are now staring at the core with dollar signs in their eyes.
		LaytheSrfLanded = The sand contains clay minerals that only form in liquid water over long periods. Laythe's oceans are ancient.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsDeepCoreAnalysis
	title = Stratigraphic Sequence Analysis
	baseValue = 20
	scienceCap = 25
	dataScale = 1
	requireAtmosphere = False
	situationMask = 1
	biomeMask = 1

	RESULTS
	{
		default = Radiometric dating of the deepest layers gives an age for this crust. The number is very large and the geologists are very happy.
		default = Correlating the layers with known impacts produces a timeline of this world's history, bombardment by bombardment.
		default = Isotope ratios change between layers, recording a slow shift in climate, volcanism, or both.
		DunaSrfLanded = The layers record Duna's transition from a wetter past to the dry world of today. Somewhere in here, its rivers stopped.
		EveSrfLanded = Periodic global volcanic episodes are recorded throughout the sequence. Eve resurfaces itself on a regular schedule.
		EelooSrfLanded = The ices preserve isotopic ratios from the original protoplanetary disk. This sample is a direct look at the system's birth.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsSolarWindAnalysis
	title = Solar Isotope Analysis
	baseValue = 25
	scienceCap = 30
	dataScale = 1
	requireAtmosphere = False
	situationMask = 48
	biomeMask = 0

	RESULTS
	{
		default = The mass spectrometer counts the oxygen isotopes in the captured wind. The ratio differs from every planet you have sampled; the sun has its own recipe.
		default = Noble gas abundances in the sample define the composition of the original solar nebula more precisely than ever before.
		default = Nitrogen isotopes in the solar wind are wildly different from those on Kerbin. Kerbin's nitrogen came from somewhere else.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsDustAnalysis
	title = Dust Grain Analysis
	baseValue = 18
	scienceCap = 22
	dataScale = 1
	requireAtmosphere = False
	situationMask = 48
	biomeMask = 0

	RESULTS
	{
		default = Each grain is extracted from the aerogel with a tiny needle and a lot of swearing. They contain presolar silicates, older than the sun itself.
		default = One grain contains glycine, a simple amino acid. The building blocks of life are floating around out here for free.
		default = Some grains are crystalline, some are glassy. The mix tells a story of material shuffled from the hot inner disk to the cold outer one.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsCometAnalysis
	title = Cometary Material Analysis
	baseValue = 45
	scienceCap = 55
	dataScale = 1
	requireAtmosphere = False
	situationMask = 48
	biomeMask = 0

	RESULTS
	{
		default = The comet's dust contains deuterium-rich water ice and complex organics. Comets like this may have delivered Kerbin's oceans.
		default = Chondrule-like grains in the comet sample formed at blazing temperatures near the sun. The early solar system was a very well-mixed place.
		default = The organic inventory of the sample is staggering: chains, rings and polymers. Comets are cold, dark chemistry labs.
	}
}

// ===================================================================================
//  LONG-DURATION SURVEYS
// ===================================================================================

EXPERIMENT_DEFINITION
{
	id = fhsCosmicRay
	title = Galactic Cosmic Ray Survey
	baseValue = 15
	scienceCap = 20
	dataScale = 1
	requireAtmosphere = False
	situationMask = 48
	biomeMask = 0

	RESULTS
	{
		default = The detector logs a steady drizzle of high-energy nuclei from distant supernovae. A few hits came with more energy than anything Kerbals can make.
		default = Over the survey the cosmic ray count rises and falls with solar activity. The sun's magnetic bubble is our shield.
		SunInSpaceHigh = Free of any planet's protection, the detector counts the raw cosmic ray background between the worlds. Mission planners take careful notes about crew shielding.
		SunInSpaceLow = Close to the sun, the cosmic ray rate drops sharply. The solar wind sweeps the galactic particles away.
		JoolInSpaceHigh = Out here the sun's shield is weaker, and the cosmic ray count is markedly higher than near Kerbin.
		EelooInSpaceHigh = Near the edge of the planetary system, the galactic cosmic ray flux is the highest you have ever measured.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsRadioAstronomy
	title = Low-Frequency Radio Sky Survey
	baseValue = 25
	scienceCap = 30
	dataScale = 2
	requireAtmosphere = False
	situationMask = 49
	biomeMask = 0

	RESULTS
	{
		default = Far from Kerbin's radio chatter, the antenna hears the faint hiss of the early universe. Also, faintly, a jingle for a soft drink from 30 years ago.
		default = The survey maps the low-frequency sky, which glows with synchrotron radiation from electrons spiraling through the galaxy's magnetic field.
		default = Radio bursts from the sun sweep down in frequency as shock waves travel outward. The survey catches dozens.
		JoolInSpaceHigh = Jool is screaming. Its magnetosphere emits powerful radio bursts that drown out the sky. The data is fascinating anyway.
		JoolInSpaceLow = The decametric radio emission from Jool's magnetosphere is deafening at this range. The antenna gain has been turned down to "polite".
		SunInSpaceHigh = Deep in interplanetary space, this is the quietest radio sky any Kerbal instrument has ever heard.
		TyloSrfLanded = Sheltered on Tylo's surface, the receiver records a remarkably clean radio sky between Jool's outbursts.
		EelooSrfLanded = From the cold, quiet surface of Eeloo the faint radio glow of the galaxy comes through crystal clear.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsTerminationShock
	title = Termination Shock Crossing
	baseValue = 80
	scienceCap = 80
	dataScale = 2
	requireAtmosphere = False
	situationMask = 32
	biomeMask = 0

	RESULTS
	{
		default = The plasma instruments record the solar wind abruptly slowing from supersonic to subsonic speed. The probe has crossed the termination shock, the first boundary of the sun's influence.
		default = Magnetic field strength jumps and the particle counters go wild. The solar wind is piling up against something out in the dark.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsHeliopause
	title = Heliopause Observation
	baseValue = 200
	scienceCap = 200
	dataScale = 3
	requireAtmosphere = False
	situationMask = 32
	biomeMask = 0

	RESULTS
	{
		default = The solar wind has fallen silent. The plasma surrounding the probe is now denser, colder and alien: it is the interstellar medium. For the first time, a Kerbal-made object has left the sun's bubble behind. Several engineers are seen quietly crying in the control room.
		default = Cosmic ray counts jump and low-energy solar particles vanish almost entirely. The magnetic field direction stays mysteriously unchanged. The probe is outside the heliosphere, sampling the space between the stars.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsSeismicNetwork
	title = Long-Period Seismic Monitoring
	baseValue = 30
	scienceCap = 35
	dataScale = 1.5
	requireAtmosphere = False
	situationMask = 1
	biomeMask = 0

	RESULTS
	{
		default = A full day of patient listening reveals faint quakes from deep inside the body. Their echoes outline the shape of a core.
		default = The seismometer records the slow tidal breathing of the crust, flexing in time with the orbit.
		KerbinSrfLanded = The data is dominated by surf, wind, and something that sounds suspiciously like a large herd. Still, a few deep quakes come through.
		MunSrfLanded = Munquakes ring for a long time in the dry, cold crust, like a bell. The Mun's interior is mostly solid, with a small, partly molten core.
		DunaSrfLanded = Faint marsquakes, er, Dunaquakes, suggest Duna's interior is still slowly cooling and contracting.
		EveSrfLanded = Eve is seismically noisy. Deep tremors suggest active magma chambers beneath the surface.
		LaytheSrfLanded = The quakes travel strangely, slowed by a layer of liquid deep below. Laythe has a subsurface ocean in addition to its surface one.
		VallSrfLanded = Constant ice-quakes as Jool's tides crack and flex Vall's shell. There is definitely liquid water underneath.
		TyloSrfLanded = Tylo is quiet and rigid. Its dense interior barely registers Jool's tidal tug.
		MohoSrfLanded = Strong thermal quakes accompany the day/night cycle as the crust expands and contracts in the sun's heat.
		IkeSrfLanded = Ike is seismically dead. The only signal is Duna's tidal pull, steady as a metronome.
		GillySrfLanded = Gilly is a loose rubble pile; seismic waves scatter and fade almost instantly.
	}
}

// ===================================================================================
//  INSTANT INSTRUMENTS (stock ModuleScienceExperiment)
// ===================================================================================

EXPERIMENT_DEFINITION
{
	id = fhsMagnetometer
	title = Magnetometer Reading
	baseValue = 8
	scienceCap = 10
	dataScale = 1
	requireAtmosphere = False
	situationMask = 56
	biomeMask = 16

	RESULTS
	{
		default = The boom-mounted magnetometer measures the local field. The needle twitches thoughtfully.
		default = Field strength and direction recorded. The numbers will make more sense once a few more worlds are mapped.
		KerbinInSpaceLow = Kerbin's magnetic field is strong and well-behaved here, with a clean dipole shape.
		KerbinInSpaceHigh = The field is stretched out on the night side into a long magnetotail by the solar wind.
		KerbinFlyingHigh = The field reading is noisy, but the dipole is unmistakable.
		MunInSpaceLow = The Mun has no global field, but certain regions are strangely magnetized, as if frozen in from an ancient dynamo.
		MinmusInSpaceLow = No measurable field. Minmus is as magnetically interesting as a bowl of ice cream.
		DunaInSpaceLow = Duna's global field died long ago. Patches of magnetized crust remain, like fossils.
		EveInSpaceLow = Eve has no internal field, but its thick ionosphere interacts with the solar wind to create an induced magnetosphere.
		JoolInSpaceLow = The needle hits the stop. Jool's magnetic field is enormous.
		JoolInSpaceHigh = Even far out, Jool's field dominates. Its magnetosphere is one of the largest structures in the system.
		LaytheInSpaceLow = Laythe's field flickers in rhythm with Jool's rotation. A conductive salty ocean below is responding to the giant planet's field.
		MohoInSpaceLow = A weak, offset global field. Moho's oversized iron core is still churning, barely.
		SunInSpaceHigh = The interplanetary magnetic field, spiraling outward as the sun rotates beneath it.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsPlasmaWave
	title = Plasma Wave Spectrum
	baseValue = 10
	scienceCap = 12
	dataScale = 1
	requireAtmosphere = False
	situationMask = 48
	biomeMask = 0

	RESULTS
	{
		default = The receiver picks up whistling, chirping plasma waves. Turned into audio, it sounds like a very distant aviary.
		default = Electron density measured from the plasma frequency. Space is not quite as empty as advertised.
		KerbinInSpaceHigh = Chorus waves near Kerbin sound like birdsong at dawn. The scientists have started a playlist.
		JoolInSpaceHigh = Jool's magnetosphere is roaring with radio and plasma waves. It's the loudest place in the system.
		SunInSpaceLow = Langmuir waves crackle in the dense solar wind as electron beams race outward from flares.
		SunInSpaceHigh = Quiet, sparse solar wind plasma, punctuated by the occasional shock wave from a solar eruption.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsNeutronSpec
	title = Neutron Spectrometry
	baseValue = 10
	scienceCap = 12
	dataScale = 1
	requireAtmosphere = False
	situationMask = 16
	biomeMask = 16

	RESULTS
	{
		default = Cosmic rays knock neutrons out of the surface below. Counting how many slow down tells you how much hydrogen, and so how much water, is hiding there.
		default = The neutron flux is uniform here: dry, boring rock. Somebody note it on the map anyway.
		MunInSpaceLow = A dip in fast neutrons over the poles: there may be water ice hiding in permanently shadowed craters.
		MinmusInSpaceLow = The flats show a strong hydrogen signal. Minmus is wetter than it looks.
		DunaInSpaceLow = Hydrogen-rich ground ice is detected beneath Duna's dusty surface, especially toward the poles.
		VallInSpaceLow = The neutron counts are dominated by water ice. Unsurprising, given that Vall is mostly water ice.
		DresInSpaceLow = Mixed signals: some regions are hydrated, others are bone dry. Dres's crust is a patchwork.
		EelooInSpaceLow = Eeloo's surface is extremely hydrogen-rich. It is practically a snowball with ambition.
		IkeInSpaceLow = Ike is dry. Very dry. Exceptionally, impressively dry.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsMassSpec
	title = Atmospheric Mass Spectrometry
	baseValue = 12
	scienceCap = 15
	dataScale = 1
	requireAtmosphere = True
	situationMask = 12
	biomeMask = 4

	RESULTS
	{
		default = The inlet sniffs the air and reports its composition molecule by molecule.
		KerbinFlyingLow = Nitrogen, oxygen, argon, water vapor, and a strong whiff of snacks from the cockpit.
		KerbinFlyingHigh = The upper atmosphere is thin and dry, with a measurable ozone layer.
		EveFlyingLow = Thick carbon dioxide with sulfuric aerosols. The sample inlet is now slightly dissolved.
		EveFlyingHigh = Eve's upper atmosphere contains surprisingly complex sulfur chemistry. The purple haze is no accident.
		DunaFlyingLow = A thin carbon dioxide atmosphere with traces of water vapor and methane. Methane? Here?
		DunaFlyingHigh = Duna's upper atmosphere is leaking hydrogen to space. Its water is escaping, molecule by molecule.
		LaytheFlyingLow = Nitrogen and oxygen, much like home. The flight surgeon still recommends keeping helmets on.
		LaytheFlyingHigh = Trace volcanic gases suggest active vents somewhere on Laythe.
		JoolFlyingHigh = Hydrogen, helium, methane and ammonia. Jool smells exactly as you'd expect a giant green planet to smell.
		JoolFlyingLow = The sample is hot, dense and full of exotic hydrocarbons. The instrument is not expected to last long.
	}
}

// ===================================================================================
//  IMAGING (science cameras: every photo is also saved to Screenshots/FarHorizons)
// ===================================================================================

EXPERIMENT_DEFINITION
{
	id = fhsPanorama
	title = Surface Panorama
	baseValue = 6
	scienceCap = 8
	dataScale = 4
	requireAtmosphere = False
	situationMask = 3
	biomeMask = 3

	RESULTS
	{
		default = A sweeping panorama of the landing site. The geologists zoom in on every rock; the public relations team zooms in on the lander.
		default = The horizon is strangely close and strangely beautiful. This one is going on a poster.
		default = Stitched together from dozens of frames, the panorama shows boulders, ripples and a long, lonely shadow cast by your spacecraft.
		KerbinSrfLanded = A lovely panorama of home. Somebody's mother will frame it.
		MunSrfLanded = Grey regolith, black sky, and Kerbin hanging overhead. The most famous view in Kerbal history, now in high resolution.
		MinmusSrfLanded = Glittering flats stretch to an impossibly near horizon under a black sky.
		DunaSrfLanded = A rust-colored desert under a butterscotch sky. The sunset photos turn out blue, which confuses everyone.
		EveSrfLanded = Everything is purple and the sky is thick enough to swim through. The photo looks like a fever dream.
		LaytheSrfLanded = Waves lap at the shore while Jool looms enormous in the sky. Possibly the most beautiful photo ever taken.
		TyloSrfLanded = Jool hangs low over a cratered, ash-grey plain. The lander's legs are visibly unhappy about the gravity.
		EelooSrfLanded = A faint, frozen landscape, lit by a sun that is little more than a very bright star.
		GillySrfLanded = The horizon curves away so sharply the lander seems to be perched on top of a small grey ball. Which it is.
		VallSrfLanded = Cracked blue ice under a black sky, with Jool's green crescent filling half the frame.
		MohoSrfLanded = The sun is huge, white and merciless. The photo is mostly glare and baked rock.
		BopSrfLanded = A dark, lumpy landscape. Something about the shadows makes the crew uneasy.
		KerbinSrfSplashed = Endless rolling waves to the horizon, and the faint smudge of the Space Center on the coast.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsOrbitalImaging
	title = Orbital Surface Imaging
	baseValue = 6
	scienceCap = 8
	dataScale = 4
	requireAtmosphere = False
	situationMask = 24
	biomeMask = 24

	RESULTS
	{
		default = A crisp strip of terrain passes beneath the lens. Craters, ridges and plains are mapped in fine detail.
		default = The image reveals landforms invisible from the surface: ancient flow channels, faults and the rims of buried craters.
		default = Landing site planners are already drawing circles on this one.
		MunInSpaceLow = Crater upon crater upon crater. The image also catches the glint of an old Kerbal lander. Or a very shiny rock.
		MinmusInSpaceLow = The flats are so smooth and reflective that the image looks like a frozen lake.
		DunaInSpaceLow = Dry river valleys meander across the terrain. Water once flowed here.
		DunaFlyingHigh = Dust devils trail long dark streaks across the plains below.
		EveInSpaceLow = Thick cloud decks hide most of the surface, but the occasional gap shows dark volcanic plains.
		LaytheInSpaceLow = Islands scattered across a vast ocean. Some of the coastlines look suspiciously like volcanic calderas.
		VallInSpaceLow = Long cracks crisscross the icy surface, stained reddish-brown where something has seeped up from below.
		TyloInSpaceLow = Huge, ancient impact basins dominate the view. Tylo has not been resurfaced in a very long time.
		IkeInSpaceLow = Deep shadows and sharp ridges. Ike is a dramatic photographer's subject, for a rock.
		KerbinInSpaceLow = Clouds, oceans and the faint lights of the Space Center. Home looks small from here.
		KerbinFlyingHigh = The coastline and mountains roll by, crisp and green.
	}
}

EXPERIMENT_DEFINITION
{
	id = fhsTelescopeImaging
	title = Telescopic Imaging
	baseValue = 10
	scienceCap = 14
	dataScale = 5
	requireAtmosphere = False
	situationMask = 32
	biomeMask = 0

	RESULTS
	{
		default = The telescope resolves surface markings, shape and color. A whole world, captured in a single frame.
		default = The image is sharp enough to measure the body's size, shape and brightness. The astronomers are thrilled.
		MohoInSpaceHigh = A tiny, dark, heavily cratered world, glinting in the furious light of the sun.
		EveInSpaceHigh = A brilliant purple disk with swirling, featureless clouds. Its atmosphere hides everything.
		GillyInSpaceHigh = A lumpy, potato-shaped rock. It is not even trying to be round.
		KerbinInSpaceHigh = Blue oceans, green continents, white clouds. A beautiful world, and it's ours.
		MunInSpaceHigh = Grey and cratered, with dark maria and bright ejecta rays radiating from young craters.
		MinmusInSpaceHigh = A pale mint-green world, smooth flats glinting between low hills.
		DunaInSpaceHigh = A red world with white polar caps and dark streaks of exposed rock.
		IkeInSpaceHigh = A dark grey moon, hanging close to Duna. They look like they're about to have a conversation.
		DresInSpaceHigh = A grey, battered dwarf planet. Faint streaks of debris trail along its orbit.
		JoolInSpaceHigh = Bands of green cloud swirl across Jool's face, with storms large enough to swallow Kerbin whole.
		LaytheInSpaceHigh = A blue ocean world with scattered islands. The astronomers spend a long time looking at this one.
		VallInSpaceHigh = An icy, bluish moon with long dark lines across its face.
		TyloInSpaceHigh = A large, pale, heavily cratered moon. It looks deceptively gentle.
		BopInSpaceHigh = A small, dark, irregular body. Captured asteroid? Something else? The image raises more questions than it answers.
		PolInSpaceHigh = A tiny yellowish moon covered in bizarre spiky terrain.
		EelooInSpaceHigh = A small, bright, icy world, glimmering at the dark edge of the solar system.
	}
}

