FARHORIZONS_SETTINGS
{
	// Auto      - Photos go through the game's real cameras, so visual mods (Scatterer, EVE,
	//             TUFX, Parallax, ...) appear in them. The main view blinks to the camera's
	//             viewpoint for a few frames, like a shutter. Map view and IVA fall back to Offscreen.
	// Offscreen - Render privately with cloned cameras. No blink, but no visual-mod effects.
	photoMode = Auto

	// Frames to hold the camera's pose before capturing. Temporal effects (EVE volumetric
	// clouds, TAA) need a few frames to converge. Raise this if clouds look smeared in photos.
	settleFrames = 8

	// Render the live capture at N x screen resolution (1-4). Higher values are sharper but slower,
	// and some screen-space effects may not support it.
	superSize = 1
}
